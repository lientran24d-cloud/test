<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grade 4 - Practice Test 5 | Lighthouse English - Ms. Linda's Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #fce7f3 100%);
            min-height: 100vh;
        }
        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #cbd5e1;
        }
        .btn-3d:hover {
            transform: translateY(-2px);
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cbd5e1;
        }
        .option-selected {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 5px 0 #2563eb !important;
        }
        .option-correct {
            border-color: #22c55e !important;
            background-color: #dcfce7 !important;
            box-shadow: 0 5px 0 #16a34a !important;
        }
        .option-wrong {
            border-color: #ef4444 !important;
            background-color: #fee2e2 !important;
            box-shadow: 0 5px 0 #dc2626 !important;
        }
        .word-chip {
            box-shadow: 0 4px 0 #93c5fd;
            transition: all 0.12s ease;
        }
        .word-chip:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #93c5fd;
        }
        .letter-box:focus {
            outline: none;
            border-color: #f59e0b;
            background-color: #fffbeb;
            transform: scale(1.06);
        }
        .logo-trigger {
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
        }
        .logo-trigger:hover {
            transform: scale(1.04);
        }
    </style>
</head>
